name: Windows Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare pinned build dependencies
        run: ./setup.ps1
      - name: Build Windows executables
        run: ./build.ps1
      - name: Run core, protocol, GUI and import checks
        run: ./test.ps1 -Gui
      - name: Package release
        run: ./package.ps1
      - name: Verify packaged executables
        run: python -B ctests/smoke_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: NetCollcet-C-Windows-x64
          path: |
            dist/NetCollcet-C-V*-Windows-x64.zip
            dist/NetCollcet-C-V*-Windows-x64.zip.sha256
          if-no-files-found: error
